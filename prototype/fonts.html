<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyAlert font tester</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<style>
:root { --bg: #fff; --ink: #1d1f24; --muted: #6b7079; --line: #e2e4e8; --acc: #E8702A; }
:root[data-theme="dark"] { --bg: #23252b; --ink: #f1f2f4; --muted: #9aa0aa; --line: #3a3d45; }
html, body { margin: 0; height: 100%; background: var(--bg); }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }   /* the real prototype, so it always matches index.html */
.fp { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 10px; max-width: calc(100vw - 32px); box-sizing: border-box;
      background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18); font: 13px/1.3 system-ui, -apple-system, sans-serif; }
.fp-nums { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.fp-nums button { width: 32px; height: 32px; font: 600 13px system-ui, sans-serif; font-variant-numeric: tabular-nums; color: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.fp-nums button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.fp-nums button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }   /* the combination on screen */
.fp-lab { color: var(--muted); font-size: 12px; text-align: center; }
.fp-lab b { color: var(--ink); font-weight: 650; }
</style>
</head>
<body>
<iframe id="app" src="index.html" title="SkyAlert prototype"></iframe>
<div class="fp" role="group" aria-label="Font combinations">
  <div class="fp-nums" id="nums"></div>
  <div class="fp-lab" id="lab" aria-live="polite"></div>
</div>
<script>
  // display = brand, headings and big numbers · body = everything else · mono = coordinates and codes
  const COMBOS = [
    { name: 'Current', d: 'Archivo', b: 'Archivo', m: 'IBM Plex Mono', q: ['Archivo:wdth,wght@62..125,300..900', 'IBM+Plex+Mono:wght@400;500'] },
    { name: 'Techy', d: 'Space Grotesk', b: 'Inter', m: 'JetBrains Mono', q: ['Space+Grotesk:wght@300..700', 'Inter:wght@100..900', 'JetBrains+Mono:wght@400;500'] },
    { name: 'Clean modern', d: 'Geist', b: 'Geist', m: 'Geist Mono', q: ['Geist:wght@100..900', 'Geist+Mono:wght@400;500'] },
    { name: 'Soft geometric', d: 'Sora', b: 'Manrope', m: 'JetBrains Mono', q: ['Sora:wght@100..800', 'Manrope:wght@200..800', 'JetBrains+Mono:wght@400;500'] },
    { name: 'Friendly', d: 'Outfit', b: 'DM Sans', m: 'DM Mono', q: ['Outfit:wght@100..900', 'DM+Sans:wght@100..1000', 'DM+Mono:wght@400;500'] },
    { name: 'Characterful', d: 'Bricolage Grotesque', b: 'Figtree', m: 'JetBrains Mono', q: ['Bricolage+Grotesque:wght@200..800', 'Figtree:wght@300..900', 'JetBrains+Mono:wght@400;500'] },
    { name: 'Editorial serif', d: 'Fraunces', b: 'Inter', m: 'IBM Plex Mono', q: ['Fraunces:wght@100..900', 'Inter:wght@100..900', 'IBM+Plex+Mono:wght@400;500'] },
    { name: 'Elegant serif', d: 'Instrument Serif', b: 'Instrument Sans', m: 'IBM Plex Mono', q: ['Instrument+Serif', 'Instrument+Sans:wght@400..700', 'IBM+Plex+Mono:wght@400;500'] },
    { name: 'Bold & wide', d: 'Unbounded', b: 'Onest', m: 'JetBrains Mono', q: ['Unbounded:wght@200..900', 'Onest:wght@100..900', 'JetBrains+Mono:wght@400;500'] },
    { name: 'Artsy', d: 'Syne', b: 'Work Sans', m: 'DM Mono', q: ['Syne:wght@400..800', 'Work+Sans:wght@100..900', 'DM+Mono:wght@400;500'] },
    { name: 'Polished', d: 'Plus Jakarta Sans', b: 'Plus Jakarta Sans', m: 'JetBrains Mono', q: ['Plus+Jakarta+Sans:wght@200..800', 'JetBrains+Mono:wght@400;500'] },
    { name: 'Easy to read', d: 'Lexend', b: 'Lexend', m: 'IBM Plex Mono', q: ['Lexend:wght@100..900', 'IBM+Plex+Mono:wght@400;500'] },
    { name: 'Corporate', d: 'Red Hat Display', b: 'Red Hat Text', m: 'Red Hat Mono', q: ['Red+Hat+Display:wght@300..900', 'Red+Hat+Text:wght@300..700', 'Red+Hat+Mono:wght@400;500'] },
  ];
  const FRAME = document.getElementById('app'), NUMS = document.getElementById('nums'), LAB = document.getElementById('lab');
  const DISPLAY_SEL = 'h1, h2, h3, .br, .ov-num, .mv, .mv-num, .cf-n, .rk.xl';   // where the display font goes inside the prototype
  const url = (c) => 'https://fonts.googleapis.com/css2?' + c.q.map((f) => 'family=' + f).join('&') + '&display=swap';
  const stack = (f) => `'${f}', system-ui, -apple-system, 'Segoe UI', sans-serif`;
  let i = 0;
  try { i = Math.max(0, Math.min(COMBOS.length - 1, +localStorage.getItem('sa-font') || 0)); } catch (e) {}

  NUMS.innerHTML = COMBOS.map((c, k) => `<button type="button" data-k="${k}" title="${c.name}: ${c.d === c.b ? c.d : c.d + ' + ' + c.b}">${k + 1}</button>`).join('');

  function apply() {
    const c = COMBOS[i];
    LAB.innerHTML = `${i + 1}. <b>${c.d === c.b ? c.d : c.d + ' + ' + c.b}</b> · ${c.name} · mono: ${c.m}`;
    NUMS.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.k === i));
    try { localStorage.setItem('sa-font', i); } catch (e) {}
    const doc = FRAME.contentDocument;
    if (!doc?.head) return;
    let link = doc.getElementById('ft-link'), st = doc.getElementById('ft-style');
    if (!link) { link = doc.createElement('link'); link.id = 'ft-link'; link.rel = 'stylesheet'; doc.head.append(link); }
    if (!st) { st = doc.createElement('style'); st.id = 'ft-style'; doc.head.append(st); }
    link.href = url(c);
    st.textContent = `:root { --f: ${stack(c.b)}; --f-d: ${stack(c.d)}; --f-mono: '${c.m}', ui-monospace, 'SF Mono', Menlo, monospace; } ${DISPLAY_SEL} { font-family: var(--f-d); }`;
    doc.fonts?.ready.then(() => FRAME.contentWindow.dispatchEvent(new Event('resize')));   // let the page re-measure text that changed width
  }
  const go = (d) => { i = (i + d + COMBOS.length) % COMBOS.length; apply(); };
  FRAME.addEventListener('load', () => {
    apply();
    const doc = FRAME.contentDocument, sync = () => { document.documentElement.dataset.theme = doc.documentElement.dataset.theme || 'light'; };
    new MutationObserver(sync).observe(doc.documentElement, { attributes: true, attributeFilter: ['data-theme'] });   // picker follows the page's light/dark theme
    sync();
    doc.addEventListener('keydown', key);
  });
  NUMS.onclick = (e) => { const b = e.target.closest('button'); if (b) { i = +b.dataset.k; apply(); } };
  function key(e) {   // ← → also step through the combinations
    if (e.target.closest?.('input, textarea, select, .leaflet-container')) return;   // arrows pan the map when it has focus
    if (e.key === 'ArrowRight' && !e.target.closest?.('.hzt')) go(1);
    else if (e.key === 'ArrowLeft' && !e.target.closest?.('.hzt')) go(-1);
  }
  document.addEventListener('keydown', key);
  apply();
</script>
</body>
</html>
