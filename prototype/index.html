<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyAlert Live</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<!-- Fonts are optional; the stack falls back to system fonts offline -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* =====================================================================
   TOKENS — same neutral palette as ui-playground.html
   ===================================================================== */
:root {
  --f: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --ease: cubic-bezier(.65, 0, .35, 1);
  --fire: #F5823A; --fire-deep: #D96527; --amber: #F2C14E;
  --flood: #65BCE8; --flood-mid: #3597CB; --cyan: #A7DDF3;
}
:root, [data-theme="light"] {
  color-scheme: light;
  --bg: #FAF8F4; --surface: #FFFFFF; --surface-2: #F0EFEB; --surface-3: #E5E6E8;
  --ink: #25272C; --ink-2: #44474E; --muted: #666A72; --faint: #858890;
  --line: #E2E1DD; --line-2: #CACBCF;
  --soft-shadow: 0 1px 2px rgba(37, 39, 44, .06), 0 8px 24px rgba(37, 39, 44, .08);
  --map-land: #F3F1EC;
  --fire-pale: #FFF0E5; --fire-soft: rgba(245, 130, 58, .32); --fire-band: rgba(245, 130, 58, .16); --fire-text: #B14F17; --fire-line: #D96527;
  --flood-pale: #E7F5FC; --flood-soft: rgba(101, 188, 232, .42); --flood-band: rgba(101, 188, 232, .24); --flood-text: #1D5F85; --flood-line: #216B94;
  --fr1: #F7DFA6; --fr2: #F2C14E; --fr3: #F5823A; --fr4: #D95757;
  --frd1: #D9A21B; --frd2: #E08A0B; --frd3: #D9622B; --frd4: #BF3B3B;   /* darker bars for the fire list on white */
  --wr1: #A7DDF3; --wr2: #65BCE8; --wr3: #3597CB; --wr4: #216B94;
  --wrd1: #4FA9D6; --wrd2: #2F8CC2; --wrd3: #1F6FA3; --wrd4: #164E73;   /* darker bars for the flood list on white */
  --cell-op: .5;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #2A2C31; --surface: #32353B; --surface-2: #383B42; --surface-3: #42454D;
  --ink: #EEECE7; --ink-2: #D2D0CA; --muted: #A6A8AE; --faint: #8A8D94;
  --line: #43464E; --line-2: #575A62;
  --soft-shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 10px 28px rgba(0, 0, 0, .28);
  --map-land: #2F3237;
  --fire-pale: rgba(245, 130, 58, .14); --fire-soft: rgba(245, 130, 58, .38); --fire-band: rgba(245, 130, 58, .18); --fire-text: #F9A56E; --fire-line: #F5823A;
  --flood-pale: rgba(101, 188, 232, .14); --flood-soft: rgba(101, 188, 232, .40); --flood-band: rgba(101, 188, 232, .2); --flood-text: #93D2F1; --flood-line: #A7DDF3;
  --fr1: #E9D39A; --fr2: #F2C14E; --fr3: #F5823A; --fr4: #E06A6A;
  --frd1: #D9A21B; --frd2: #E08A0B; --frd3: #E0703A; --frd4: #D94A4A;   /* same risk-bar colours as light mode; red and orange nudged up a touch so they read on charcoal */
  --wrd1: var(--wr1); --wrd2: var(--wr2); --wrd3: var(--wr3); --wrd4: var(--wr4);
  --wr1: #2E5F7A; --wr2: #3597CB; --wr3: #65BCE8; --wr4: #A7DDF3;   /* lighter = more severe on charcoal */
  --cell-op: .62;
}
[data-hz="fire"] { --hz: var(--fire); --hz-deep: var(--fire-deep); --hz-pale: var(--fire-pale); --hz-soft: var(--fire-soft); --hz-band: var(--fire-band); --hz-text: var(--fire-text); --hz-line: var(--fire-line); --r1: var(--fr1); --r2: var(--fr2); --r3: var(--fr3); --r4: var(--fr4); --rd1: var(--frd1); --rd2: var(--frd2); --rd3: var(--frd3); --rd4: var(--frd4); }
[data-hz="flood"] { --hz: var(--flood); --hz-deep: var(--flood-mid); --hz-pale: var(--flood-pale); --hz-soft: var(--flood-soft); --hz-band: var(--flood-band); --hz-text: var(--flood-text); --hz-line: var(--flood-line); --r1: var(--wr1); --r2: var(--wr2); --r3: var(--wr3); --r4: var(--wr4); --rd1: var(--wrd1); --rd2: var(--wrd2); --rd3: var(--wrd3); --rd4: var(--wrd4); }
[data-l="1"] { --rc: var(--r1); --rcd: var(--rd1); } [data-l="2"] { --rc: var(--r2); --rcd: var(--rd2); } [data-l="3"] { --rc: var(--r3); --rcd: var(--rd3); } [data-l="4"] { --rc: var(--r4); --rcd: var(--rd4); }

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
h1, h2, h3, h4, p, dl, dd, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; }
.sp { flex: 1; }

/* the app fills the window; the map sits underneath both layouts */
.app { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: var(--bg); transition: background-color .35s; }
.layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.layer[hidden] { display: none; }
[data-k], .pc { transform-origin: 0 0; }                     /* pieces scale from their top-left corner while they move */
.flyer { position: absolute; left: 0; top: 0; z-index: 5; display: flex; align-items: baseline; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; will-change: transform; }
.flyer[hidden] { display: none; }

/* ---------- shared components ---------- */
.br { display: inline-flex; align-items: center; gap: 9px; font-weight: 750; font-size: 16px; white-space: nowrap; }
.br-m { width: 20px; height: 28px; flex: none; }   /* SkyAlert logo: flame (fire) + wave (flood) */
.lg-flame { fill: var(--fire); } .lg-wave { fill: var(--flood-mid); }
.smp { display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--muted); border: 1px dashed var(--line-2); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.thb { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); cursor: pointer; }
.thb:hover { background: var(--surface-2); }
.thb svg { width: 16px; height: 16px; }
.rk { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; white-space: nowrap; }
.tk { display: inline-flex; gap: 2px; align-items: flex-end; }
.tk i { width: 5px; height: 12px; border-radius: 1px; background: var(--line-2); }
.tk i:nth-child(1) { height: 6px; } .tk i:nth-child(2) { height: 8px; } .tk i:nth-child(3) { height: 10px; }
.tk i.on { background: var(--rc); }
.rk.lg { font-size: 20px; gap: 10px; } .rk.lg .tk i { width: 7px; height: 20px; } .rk.lg .tk i:nth-child(1) { height: 9px; } .rk.lg .tk i:nth-child(2) { height: 13px; } .rk.lg .tk i:nth-child(3) { height: 17px; }
.rk.xl { font-size: 34px; font-weight: 500; gap: 12px; } .rk.xl .tk i { width: 9px; height: 30px; } .rk.xl .tk i:nth-child(1) { height: 12px; } .rk.xl .tk i:nth-child(2) { height: 18px; } .rk.xl .tk i:nth-child(3) { height: 24px; }
.kd { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.kd i { width: 9px; height: 9px; border-radius: 50%; border: 1.6px dashed var(--hz-text); }
.lgd { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.lgd span { display: inline-flex; align-items: center; gap: 6px; }
.lgd i { width: 18px; height: 0; border-top: 2.4px solid var(--hz-line); }
.lgd .lg-p i { border-top-style: dashed; border-top-color: var(--hz); }
.cfr { display: block; flex: none; }
.cfr-bg { fill: none; stroke: var(--surface-3); }
.cfr-fg { fill: none; stroke: var(--hz-deep); stroke-linecap: round; }
.cfr text { font-weight: 700; fill: var(--ink); font-family: var(--f); }
.lys { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; }
.ly { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; color: var(--ink-2); }
.ly input { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); cursor: pointer; flex: none; }
.ly-g { width: 14px; height: 14px; flex: none; }
.ly-observed { border-radius: 50%; background: var(--ink-2); transform: scale(.65); }
.ly-predicted { border: 1.5px dashed var(--hz-deep); background: repeating-linear-gradient(45deg, var(--hz-soft) 0 2px, transparent 2px 5px); border-radius: 2px; }
.ly-context { height: 0; width: 16px; border-top: 2px dotted var(--muted); }
.attr { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chart { display: block; width: 100%; height: auto; overflow: visible; }
.c-bar { fill: var(--hz-soft); }
.c-obs { fill: none; stroke: var(--hz-line); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.c-pred { fill: none; stroke: var(--hz); stroke-width: 2.2; stroke-dasharray: 6 5; stroke-linecap: round; }
.c-band { fill: var(--hz-band); }
.c-now { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
.c-th { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 1.5 4; stroke-linecap: round; }
.c-ax { font-size: 11.5px; fill: var(--muted); font-family: var(--f); }
.c-nowt { font-size: 11.5px; font-weight: 600; fill: var(--ink-2); font-family: var(--f); }

/* ---------- fire / flood toggle (animated icons) ---------- */
.hzt { --t-c: var(--fire); --t-pale: var(--fire-pale); position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); flex: none; }
.hzt[data-hz="flood"] { --t-c: var(--flood); --t-pale: var(--flood-pale); }
.hzt-ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--t-pale); box-shadow: inset 0 0 0 1.5px var(--t-c); transition: transform .5s var(--ease), background-color .5s, box-shadow .5s; }
.hzt[data-hz="flood"] .hzt-ind { transform: translateX(100%); }
.hzt button { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 14px; border: 0; background: none; color: var(--muted); font-weight: 650; font-size: 14px; cursor: pointer; white-space: nowrap; transition: color .35s; }
.hzt button[aria-checked="true"] { color: var(--ink); }
.hzt button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 999px; }
.ico { width: 20px; height: 20px; flex: none; overflow: visible; }
.ico-flood path { fill: transparent; stroke: currentColor; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; transform-box: fill-box; transition: fill .45s, stroke .45s; }   /* off: outline of the logo part; half the stroke is clipped away, leaving a 0.8px inner line */
.ico-flood path { transform-origin: 50% 50%; }
.ico-fire .fl-outer { fill: transparent; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; transform-box: fill-box; transform-origin: 50% 100%; transition: fill .45s, stroke .45s; }
.ico-fire .fl-inner { fill: var(--amber); opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transform: scale(.4, .2); transition: opacity .35s, transform .5s var(--ease); }
.hzt[data-hz="fire"] .ico-fire .fl-outer { fill: var(--fire); stroke: var(--fire-deep); animation: fl-sway 3.2s ease-in-out infinite; }
.hzt[data-hz="fire"] .ico-fire .fl-inner { opacity: 1; transform: none; animation: fl-flick 1.7s ease-in-out .2s infinite; }   /* inner flame grows in and flickers */
.hzt[data-hz="flood"] .ic-wave { fill: var(--flood-mid); stroke: transparent; animation: wv-bob 2.6s ease-in-out infinite; }
@keyframes fl-sway { 0%, 100% { transform: skewX(0) scaleY(1); } 50% { transform: skewX(-3deg) scaleY(1.03); } }
@keyframes fl-flick { 0%, 100% { transform: scale(1, 1); } 35% { transform: scale(.92, 1.1); } 70% { transform: scale(1.05, .94); } }
@keyframes wv-bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-1px, -1.2px); } }

/* ---------- Leaflet map (Esri tiles), themed ---------- */
.lmap { position: absolute; inset: 0; z-index: 0; isolation: isolate; background: var(--map-land); }   /* isolation keeps Leaflet's panes below the panels */
.lmap.leaflet-container { font: inherit; background: var(--map-land); }
.lmap .leaflet-overlay-pane canvas { transition: opacity .2s; } .lmap.is-flying .leaflet-overlay-pane canvas { opacity: 0; transition: none; }   /* the dot canvas is CSS-scaled mid-flight, so hide it until the flight ends */
.lmap svg.fallback { width: 100%; height: 100%; display: block; }
.m-cell { opacity: var(--cell-op); }
.m-cell.l1 { fill: var(--r1); } .m-cell.l2 { fill: var(--r2); } .m-cell.l3 { fill: var(--r3); } .m-cell.l4 { fill: var(--r4); }
.m-wind { stroke: var(--faint); fill: none; stroke-linecap: round; opacity: .7; }
.m-river { fill: none; stroke: var(--line-2); stroke-width: 6; stroke-linecap: round; }
.lm-pt { fill: var(--hz); stroke: #25272C; stroke-width: 1; fill-opacity: 1; }
.lm-gauge { background: var(--surface); border: 2px solid var(--flood-line); }
.lm-mk { position: relative; }
.lm-k { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); font: 700 12px/1 var(--f); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.lm-mk.on .lm-k { background: var(--ink); color: var(--bg); outline: 2px solid var(--ink); outline-offset: 3px; }
.lm-mk.lm-focus::after { content: ''; position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--hz-deep); animation: lm-pulse 1.6s ease-out infinite; pointer-events: none; }   /* pulsing ring on the selected fire */
.lm-mk.lm-focus .lm-lab { background: var(--ink); color: var(--bg); }
@keyframes lm-pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .lm-mk.lm-focus::after { animation: none; transform: scale(1.6); } }
.lm-mk:focus-visible .lm-k { outline: 2px solid var(--hz-deep); outline-offset: 3px; }
.lm-lab { position: absolute; left: 30px; top: 3px; white-space: nowrap; padding: 1px 7px; border-radius: 4px; background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--ink); font: 650 12.5px/18px var(--f); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }

/* =====================================================================
   OVERVIEW (concept 07, rearranged so every piece sits near its map-view spot)
   ===================================================================== */
.ov { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "hd hd" "hero right" "foot foot"; column-gap: 64px; padding: 22px 56px 24px; }
.ov > * { pointer-events: auto; }
.ov-hd { grid-area: hd; display: flex; align-items: center; gap: 28px; padding-bottom: 14px; }
.ov-hero { grid-area: hero; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-height: 0; }
.ov-eye { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; font-size: 15px; color: var(--muted); }
.ov-eye b { color: var(--ink); font-weight: 600; }
.num { display: flex; align-items: baseline; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ov-num { font-size: 170px; font-weight: 300; letter-spacing: -.055em; margin: 14px 0 6px -8px; }
.ov-num .pct { font-size: .47em; letter-spacing: 0; color: var(--hz-text); margin-left: 6px; }
.ov-cap { font-size: 18px; color: var(--ink-2); }
.ov-row { display: flex; align-items: center; gap: 28px; margin-top: 24px; }
.ov-conf { font-size: 15px; color: var(--muted); }
.cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; padding: 12px 20px; border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 650; cursor: pointer; white-space: nowrap; transition: opacity .2s; }
.cta:hover { opacity: .9; }
.cta svg { width: 17px; height: 17px; }
.cta-ph { visibility: hidden; pointer-events: none; }   /* Flood has no past-fire button; this keeps its space so the centred hero doesn't jump on toggle */
.ov-right { grid-area: right; display: flex; flex-direction: column; min-height: 0; pointer-events: none; }   /* clicks pass through to the map in the slot */
.ov-right > * { pointer-events: auto; }
.ov-slot { position: relative; flex: 1; min-height: 160px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); pointer-events: none !important; }
.ov-go { position: absolute; left: 12px; bottom: 12px; display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); cursor: pointer; pointer-events: auto; }   /* small shortcut into the map view */
.ov-go:hover { background: var(--surface-2); }
.ov-go:focus-visible { outline: 2px solid var(--hz-deep); outline-offset: 2px; }
.ov-go svg { width: 16px; height: 16px; }
.ov-attr { align-self: flex-end; max-width: 100%; margin-top: 6px; }
.ov-cells { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 10px; height: 26px; overflow: hidden; margin-bottom: 32px; }   /* only fires that fit on line 1 show; line 2 stays as empty space */
.ov-cell { line-height: 20px; border: 0; background: none; padding: 2px 0; cursor: pointer; font-size: 15px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.ov-cell b { color: var(--ink-2); font-weight: 600; margin-right: 6px; }
.ov-cell[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--hz); }
.ov-layers { margin-top: 12px; }
.ov-layers .ly { color: var(--muted); }
.ov-foot { grid-area: foot; display: grid; gap: 14px; padding-top: 16px; }   /* tighter footer so the map gets the height */
.ov-meas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.mrow { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ml { font-size: 15px; color: var(--ink-2); }
.ml small { display: block; font-size: 13px; color: var(--muted); }
.mv { font-size: 38px; font-weight: 350; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.15; }
.mv u { text-decoration: none; font-size: 17px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.ov-sh { margin-top: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.ov-spark-l { position: relative; height: 16px; font-size: 12.5px; color: var(--muted); }
.ov-spark-l span { position: absolute; top: 0; }
.ov-spark-l span:nth-child(2) { left: 47.8%; transform: translateX(-50%); font-weight: 600; color: var(--ink-2); }
.ov-spark-l span:nth-child(3) { right: 0; }

/* =====================================================================
   MAP VIEW (concept 05): full-bleed map, three floating panels
   ===================================================================== */
.mv-layer > * { pointer-events: auto; }
.fp { position: absolute; z-index: 2; isolation: isolate; }
.pbg { position: absolute; inset: 0; z-index: -1; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--soft-shadow); }
.fp1 { left: 24px; top: 24px; width: 384px; padding: 18px 22px 20px; display: grid; gap: 14px; }
.fp1-top { display: flex; align-items: center; gap: 10px; }
.fp1-r2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cta.back { margin: 0; padding: 7px 14px; background: transparent; color: var(--ink); border-color: var(--line-2); font-size: 14px; }
.cta.back:hover { background: var(--surface-2); opacity: 1; }
.fp1 h2 { font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
.fp1-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.fp1-row .rk { flex-direction: column; align-items: center; gap: 6px; font-size: 17px; }   /* bars on top, risk word below; smaller so the row has room */
.fp1-row .tk i.on, .ov-row .tk i.on, .fp2 .tk i.on { background: var(--rcd); }   /* darker risk colours everywhere bars appear: overview, map summary, fire details + list */

/* =====================================================================
   TRAINING DATA DIALOG — stats from skyalert/output.txt
   ===================================================================== */
:root, [data-theme="light"] { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; }   /* categorical slots, validated on #FFFFFF */
[data-theme="dark"] { --s1: #3987e5; --s2: #d95926; --s3: #199e70; }              /* validated on #32353B */
.dsb { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.dsb:hover { background: var(--surface-2); }
.dsb svg, .thb.dsi svg { width: 16px; height: 16px; }
.ds { width: min(980px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: var(--soft-shadow); overflow: auto; overflow-x: hidden; overscroll-behavior: contain; }
.ds::backdrop { background: rgba(20, 21, 24, .42); }
.ds-in { padding: 26px 30px 30px; display: grid; gap: 26px; }
.ds-hd { display: flex; align-items: flex-start; gap: 16px; }
.ds-eye { font-size: 13px; font-weight: 650; color: var(--hz-text); }
.ds-hd h2 { font-size: 26px; font-weight: 750; letter-spacing: -.015em; line-height: 1.2; margin-top: 2px; }
.ds-sub { font-size: 14px; color: var(--muted); margin-top: 6px; max-width: 64ch; }
.ds-sub code, .ds-note code { font-family: var(--f-mono); font-size: .92em; }
.ds-note { font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 10px 14px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile-l { font-size: 12.5px; color: var(--muted); font-weight: 550; }
.tile-v { font-size: 28px; font-weight: 400; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; }
.tile-v u { text-decoration: none; font-size: 14px; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.tile-s { font-size: 12.5px; color: var(--muted); }
.cs { display: grid; gap: 12px; }
.cs-hd { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.cs-hd h3 { font-size: 16px; font-weight: 700; }
.cs-tk { font-size: 13.5px; color: var(--ink-2); }
.tvb { border: 1px solid var(--line-2); background: none; border-radius: 8px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.tvb:hover { background: var(--surface-2); }
.key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 10px; height: 10px; border-radius: 3px; }
.key .k-span { width: 22px; height: 8px; border-radius: 4px; background: var(--line-2); }
.key .k-mean { width: 2px; height: 12px; border-radius: 1px; background: var(--ink); }
/* shared row layout: label column + plot column with a recessive grid */
.pl { display: grid; grid-template-columns: 190px minmax(0, 1fr); column-gap: 16px; padding-right: 30px; }   /* room for the end labels */
.pl-row { display: contents; }
.pl-lab { font-size: 13.5px; color: var(--ink-2); padding: 7px 0; line-height: 1.25; min-width: 0; }
.pl-lab b { display: block; font-weight: 650; color: var(--ink); font-family: var(--f-mono); font-size: 12.5px; }
.pl-lab small { color: var(--muted); font-size: 12px; }
.pl-plot { position: relative; padding: 7px 0; border-left: 1px solid var(--line-2); background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: 25% 100%; background-position: -1px 0; }
.pl-axis { grid-column: 2; position: relative; height: 18px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pl-axis span { position: absolute; top: 3px; transform: translateX(-50%); white-space: nowrap; }
.pl-axis span:first-child { transform: none; } .pl-axis span:last-child { transform: translateX(-100%); }
/* grouped bars: thin, 2px gap, rounded data-end anchored at the baseline */
.gb { display: grid; gap: 2px; }
.gb-r { display: flex; align-items: center; gap: 6px; height: 9px; }
.gb-b { height: 9px; border-radius: 0 4px 4px 0; flex: none; }
.gb-v { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1; }
.gb-r.s1 .gb-b { background: var(--s1); } .gb-r.s2 .gb-b { background: var(--s2); } .gb-r.s3 .gb-b { background: var(--s3); }
/* band ranges: min–max span with a mean tick, on the full uint16 scale */
.rg { position: relative; height: 22px; }
.rg-span { position: absolute; top: 7px; height: 8px; border-radius: 4px; background: var(--line-2); }
.rg-sat { position: absolute; top: 4px; width: 4px; height: 14px; border-radius: 2px; background: var(--hz-deep); transform: translateX(-100%); }
.rg-mean { position: absolute; top: 3px; width: 2px; height: 16px; border-radius: 1px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); transform: translateX(-1px); }
.hit { cursor: default; }
.hit:hover .gb-b, .hit:hover .rg-span { filter: brightness(1.08); }
.hit:hover .pl-lab, .pl-row:hover .pl-lab { color: var(--ink); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.tbl th:first-child, .tbl td:first-child, .tbl .tl { text-align: left; }
.tbl-wrap { overflow-x: auto; }
.tip { position: fixed; z-index: 10; pointer-events: none; padding: 8px 11px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.45; box-shadow: var(--soft-shadow); max-width: 260px; }
.tip[hidden] { display: none; }
.tip b { font-weight: 700; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.ds-bar { display: flex; align-items: center; gap: 12px; margin-bottom: -6px; min-width: 0; }
.ds-in > *, .ds-body > * { min-width: 0; }   /* let wide rows shrink instead of widening the dialog */
.tabs { display: flex; flex: 0 1 auto; min-width: 0; gap: 4px; padding: 4px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface-2); overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 650; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.ds-body { display: grid; gap: 26px; }
.tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.exs { display: grid; gap: 18px; }
.ex { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.ex-imgs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ex-imgs figure { margin: 0; display: grid; gap: 6px; }
.ex-imgs img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--surface-3); }
.ex-imgs figcaption { font-size: 12.5px; color: var(--muted); font-weight: 550; }
.ex-st { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: 14px; }
.ex-st b { font-weight: 700; }
.ex-st span { color: var(--muted); font-size: 13px; }
.ds-empty { padding: 30px 0 10px; display: grid; gap: 8px; justify-items: start; }
.ds-empty p { color: var(--ink-2); max-width: 56ch; }
@media (max-width: 820px) {
  .ds { width: calc(100vw - 32px); max-height: calc(100dvh - 32px); }
  .ds-in { padding: 18px 16px 22px; gap: 20px; }
  .ds-hd h2 { font-size: 21px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tiles.t3 { grid-template-columns: 1fr; }
  .ex { padding: 8px; } .ex-imgs { gap: 6px; } .ex-imgs figcaption { font-size: 11.5px; }
  .ds-bar { align-items: flex-start; }
  .tile-v { font-size: 22px; }
  .pl { grid-template-columns: 104px minmax(0, 1fr); column-gap: 10px; }
  .pl-lab small { display: none; }
  .ov-hd .dsb span { display: none; } .ov-hd .dsb { padding: 0 9px; }
}

.m-stats { display: grid; grid-template-columns: auto 1fr 1fr; gap: 14px; align-items: end; }

.mss.m-sp { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }

/* =====================================================================
   LIVE DATA
   ===================================================================== */
.smp.live { color: var(--ink-2); border-style: solid; border-color: var(--hz-line); gap: 6px; }
.smp.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--hz-deep); }
.cf .cf-n { font-size: 30px; color: var(--ink); font-weight: 800; letter-spacing: -.01em; line-height: 1; font-variant-numeric: tabular-nums; }
.rs { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.rs li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; line-height: 1.35; }

.lm-pick .lm-k { background: var(--hz-deep); color: #fff; border-color: var(--hz-deep); }
.loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--bg); color: var(--ink-2); font-size: 15px; }
.loader[hidden] { display: none; }
.loader div { display: grid; gap: 10px; justify-items: center; text-align: center; padding: 16px; }
.loader i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--fire-deep); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner { position: fixed; z-index: 15; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: var(--soft-shadow); }

.banner code { font-family: var(--f-mono); font-size: .92em; }
.busy-dot { position: absolute; z-index: 3; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--soft-shadow); font-size: 12.5px; color: var(--ink-2); pointer-events: none; }

  function initMap() {

  }
  function drawData() {
    const D = DATA[S.hz];
    if (!MAP) {                                               // offline sketch
      MAPEL.innerHTML = `<svg class="fallback" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path class="m-river" d="M${RIVER.map((p) => p.join(' ')).join(' L')}"/>${rasterSVG(D)}</svg>`;
      return;
    }
    if (DATA_LAYER) DATA_LAYER.remove();
    DATA_LAYER = L.layerGroup().addTo(MAP);
    if (S.hz === 'fire' && S.mode === 'model') {              // the detector's output, drawn where the tiles really are
      if (MARKERS) MARKERS.remove();
      MARKERS = L.layerGroup().addTo(MAP);
      MODEL.detector.rows.forEach((r, i) => {
        const n = i + 1, on = i === S.mSel;
        if (S.mLayers.sat) L.imageOverlay(`model_results/det_${n}_base256.png`, r.bounds, { className: 'm-px' }).addTo(DATA_LAYER);
        if (S.mLayers.label) L.imageOverlay(`model_results/det_${n}_label_mask.png`, r.bounds, { className: 'm-px' }).addTo(DATA_LAYER);
        if (S.mLayers.model) L.imageOverlay(`model_results/det_${n}_model_mask.png`, r.bounds, { className: 'm-px', opacity: S.mLayers.label ? 0.85 : 1 }).addTo(DATA_LAYER);
        L.rectangle(r.bounds, { color: on ? '#25272C' : '#FFFFFF', weight: on ? 3 : 1.5, fill: true, fillOpacity: 0, dashArray: on ? null : '4 4' })
          .on('click', () => selectTile(i)).addTo(MARKERS);
        L.marker([r.bounds[1][0], r.bounds[0][1]], { icon: L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [-4, -4], html: `<span class="m-tile-k${on ? ' on' : ''}">${n}</span>` }), title: `Tile ${n}: caught ${r.found} of ${r.label} fire pixels` })
          .on('click', () => selectTile(i)).addTo(MARKERS);
      });
      return;
    }
    if (D.live) {                                             // real detections; no model raster until one is connected
      if (S.layers.predicted && D.modelReady) D.items.forEach((it) => {   // the model's forecast around each fire
        if (!it.fc || it.fc.status !== 'ok') return;
        const b = it.fc.bounds;
        L.imageOverlay(heatURL(it.fc), [[b.south, b.west], [b.north, b.east]], { opacity: 0.9, interactive: false }).addTo(DATA_LAYER);
      });
      if (S.layers.observed) FIRES.forEach((f) => L.circleMarker([f.latitude, f.longitude], { radius: 3.5, color: '#FFFFFF', weight: 0.8, fillColor: '#E8452C', fillOpacity: 0.9, interactive: false }).addTo(DATA_LAYER));
      drawMarkers();
      return;
    }
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 400 260');
    svg.innerHTML = rasterSVG(D);
    L.svgOverlay(svg, bounds(), { interactive: false }).addTo(DATA_LAYER);
    if (S.layers.observed) D.points.forEach((p) => {
      if (D.key === 'fire') L.circleMarker(ll(p), { radius: 4, className: 'lm-pt', interactive: false }).addTo(DATA_LAYER);
      else L.marker(ll(p), { icon: L.divIcon({ className: 'lm-gauge', iconSize: [11, 11] }), interactive: false, keyboard: false }).addTo(DATA_LAYER);
    });
    drawMarkers();
  }
  function drawMarkers() {
    if (!MAP) return;
    if (MARKERS) MARKERS.remove();
    MARKERS = L.layerGroup().addTo(MAP);
    DATA[S.hz].items.forEach((it, i) => {
      const on = i === S.sel;
      L.marker(it.latlng || ll(it.pos), {
        icon: L.divIcon({ className: 'lm-mk' + (on ? ' on' : '') + (on && S.focus ? ' lm-focus' : '') + (it.picked ? ' lm-pick' : ''), iconSize: [24, 24], iconAnchor: [12, 12], html: `<span class="lm-k">${i + 1}</span><span class="lm-lab">${it.name}</span>` }),
        title: `${it.name}, ${RISK[it.risk]} ${DATA[S.hz].live ? 'fire-weather' : 'predicted'} risk`, zIndexOffset: on ? 500 : 0,
      }).on('click', () => select(i)).addTo(MARKERS);
    });
  }

  const rel = (el) => { const a = APP.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - a.left, y: r.top - a.top, w: r.width, h: r.height }; };
  const clipOf = (r) => `inset(${r.y}px ${APP.clientWidth - r.x - r.w}px ${APP.clientHeight - r.y - r.h}px ${r.x}px round 14px)`;
  const FULL = 'inset(0px 0px 0px 0px round 0px)';

  // Fit the region into the part of the map that the current layout leaves visible
  function pads() {
    const W = APP.clientWidth, H = APP.clientHeight;
    let tl, br;
    if (S.view === 'ov') {
      const r = rel($('.ov-slot', OV));
      tl = [r.x + 12, r.y + 12]; br = [W - r.x - r.w + 12, H - r.y - r.h + 12];
    } else {
      const a = rel($('.fp1', MV)), b = rel($('.fp2', MV)), c = rel($('.fp3', MV));
      if (c.w > 0) {                                          // desktop: between the three panels
        const left = a.x + a.w + 20, right = W - b.x + 20;
        tl = [W - left - right > 260 ? left : 24, 24]; br = [right, H - c.y + 20];
      } else {                                                // phone: between the top and bottom panels
        tl = [12, a.y + a.h + 10]; br = [12, H - b.y + 10];
      }
    }
    return { tl, br };
  }
  let flyT = 0;
  function fitView(animate) {
    if (!MAP) return;
    const { tl, br } = pads();
    MAP.invalidateSize(false);
    const o = { paddingTopLeft: tl, paddingBottomRight: br, ...(S.view === 'mv' && !(S.hz === 'fire' && S.mode === 'model') && (DATA[S.hz].live || S.focus) ? { maxZoom: 9 } : {}) };   // cap zoom so close-together fires don't zoom to street level
    if (animate && !REDUCE.matches) {
      MAPEL.classList.add('is-flying');
      const land = () => { clearTimeout(flyT); MAPEL.classList.remove('is-flying'); };
      clearTimeout(flyT); flyT = setTimeout(land, 1500);            // safety net if moveend never comes
      MAP.once('moveend', land);
      MAP.flyToBounds(bounds(), { ...o, duration: 0.85, easeLinearity: 0.4 });
    }
    else MAP.fitBounds(bounds(), { ...o, animate: false });
  }
  function layoutMap() {
    MAPEL.style.clipPath = S.view === 'ov' ? clipOf(rel($('.ov-slot', OV))) : 'none';
    fitView(false);
  }

  // =====================================================================
  // THE TRANSITION
  // =====================================================================
  const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const visible = (r) => r && r.w > 0 && r.h > 0;
  // Leaf pieces only: a piece inside another piece moves with its parent
  const pieces = (layer) => $$('[data-k], .pc', layer).filter((el) => !el.parentElement.closest('[data-k], .pc'));
  function numStyle(el) {
    const cs = getComputedStyle(el), p = getComputedStyle($('.pct', el));
    return { r: rel(el), v: +$('.fn', el).textContent, fs: cs.fontSize, fw: cs.fontWeight, ls: cs.letterSpacing, c: cs.color, pfs: p.fontSize, pml: p.marginLeft, pc: p.color, pfw: p.fontWeight, pls: p.letterSpacing };
  }
  const COORD = /^\s*(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)\s*$/;
  function rollCoords(el, from, to, dur) {                     // "lat, lon" rolls from the last fire's spot to the new one
    const a = COORD.exec(from), b = COORD.exec(to);
    if (!el || !a || !b || REDUCE.matches) return;
    const dec = (b[1].split('.')[1] || '').length, t0 = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur), e = easeIO(t);
      el.textContent = t < 1 ? `${(+a[1] + (b[1] - a[1]) * e).toFixed(dec)}, ${(+a[2] + (b[2] - a[2]) * e).toFixed(dec)}` : to;
      if (t < 1) requestAnimationFrame(step);
    };
    el.textContent = from;                                     // no flash of the new value before the roll starts
    requestAnimationFrame(step);
  }
  function countUp(el, from, to, dur, delay) {                // the number changes value while it travels
    const t0 = performance.now() + delay;
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - t0) / dur));
      el.textContent = Math.round(from + (to - from) * easeIO(t));
      if (t < 1) requestAnimationFrame(step);
    };
    el.textContent = from;
    requestAnimationFrame(step);
  }

  async function go(view) {
    if (busy || view === S.view) return;
    if (view === 'ov' && S.mode === 'model') { S.mode = 'live'; render(); drawData(); }   // the overview always describes today's live map
    busy = true;
    const toMap = view === 'mv', from = active(), to = toMap ? MV : OV;
    const k = REDUCE.matches ? 0.001 : 1, A = [];
    const anim = (el, kf, o) => { const a = el.animate(kf, { duration: o.d * k, delay: (o.delay || 0) * k, easing: o.e || 'cubic-bezier(.65, 0, .35, 1)', fill: 'both' }); A.push(a); return a; };
    from.inert = true;

    // 1. measure the layout we are leaving
    const oldP = pieces(from), oldR = new Map(oldP.map((el) => [el, rel(el)]));
    const oldNumEl = $('.num', from), oN = numStyle(oldNumEl);
    const slotR = toMap ? rel($('.ov-slot', OV)) : null;

    // 2. show the new layout underneath the old one and measure it
    to.hidden = false;
    S.view = view; APP.dataset.view = view; S.focus = false;   // opening the map view shows the top 5 again
    const newP = pieces(to), newR = new Map(newP.map((el) => [el, rel(el)]));
    const newNumEl = $('.num', to), nN = numStyle(newNumEl);
    const oldByK = new Map(oldP.filter((el) => el.dataset.k && visible(oldR.get(el))).map((el) => [el.dataset.k, el]));
    // everything else is measured now too, before any animation moves an element
    const panels = $$('.fp', MV).map((fp) => ({ bg: $('.pbg', fp), f: rel(fp), a: rel($(fp.dataset.anchor, fp)) }));
    const slotTo = toMap ? null : rel($('.ov-slot', OV));
    MAP?.scrollWheelZoom[toMap ? 'enable' : 'disable']();
    fitView(true);

    const MOVE = 740, lead = toMap ? 0 : 150;                 // going back, the panels fold up first
    const sharedOld = new Set(), sharedNew = new Set();

    // 3. pieces in both layouts fly from the old spot to the new one, cross-fading on the way
    for (const el of newP) {
      const o = el.dataset.k && oldByK.get(el.dataset.k), n = newR.get(el);
      if (!o || !visible(n)) continue;
      const r = oldR.get(o), s = r.h / n.h;
      sharedOld.add(o); sharedNew.add(el);
      anim(el, [{ transform: `translate(${r.x - n.x}px, ${r.y - n.y}px) scale(${s})`, opacity: 0 }, { opacity: 0, offset: 0.3 }, { opacity: 1, offset: 0.62 }, { transform: 'none', opacity: 1 }], { d: MOVE, delay: lead });
      anim(o, [{ transform: 'none', opacity: 1 }, { opacity: 1, offset: 0.12 }, { opacity: 0, offset: 0.42 }, { transform: `translate(${n.x - r.x}px, ${n.y - r.y}px) scale(${1 / s})`, opacity: 0 }], { d: MOVE, delay: lead });
    }

    // 4. pieces only in the old layout fade out; pieces only in the new one fade in after the move
    oldP.filter((el) => !sharedOld.has(el)).forEach((el) => anim(el, [{ opacity: 1 }, { opacity: 0 }], { d: 200, e: 'ease' }));
    newP.filter((el) => !sharedNew.has(el) && visible(newR.get(el)))
      .sort((a, b) => newR.get(a).y - newR.get(b).y)
      .forEach((el, i) => anim(el, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { d: 360, delay: (toMap ? 640 : 560) + Math.min(i * 22, 260), e: 'cubic-bezier(.2, .7, .2, 1)' }));

    // 5. the big number shrinks (or grows) into place and counts to its new value
    oldNumEl.style.visibility = newNumEl.style.visibility = 'hidden';
    const fn = $('.fn', FLY), fp = $('.pct', FLY);
    fp.textContent = DATA[S.hz].unit || '%';
    FLY.hidden = false;
    anim(FLY, [
      { transform: `translate(${oN.r.x}px, ${oN.r.y}px)`, fontSize: oN.fs, fontWeight: oN.fw, letterSpacing: oN.ls, color: oN.c },
      { transform: `translate(${nN.r.x}px, ${nN.r.y}px)`, fontSize: nN.fs, fontWeight: nN.fw, letterSpacing: nN.ls, color: nN.c },
    ], { d: MOVE + 60, delay: lead });
    anim(fp, [{ fontSize: oN.pfs, marginLeft: oN.pml, color: oN.pc, fontWeight: oN.pfw, letterSpacing: oN.pls }, { fontSize: nN.pfs, marginLeft: nN.pml, color: nN.pc, fontWeight: nN.pfw, letterSpacing: nN.pls }], { d: MOVE + 60, delay: lead });   // weight + spacing too, so "/100" lands without a jump
    countUp(fn, oN.v, nN.v, (MOVE + 60) * k, lead * k);

    // 6. each panel's box grows out from the data that just landed in it (and folds back into it on the way out)
    panels.forEach(({ bg, f, a }, i) => {
      const p = 10;
      if (!visible(f) || !visible(a)) return;
      const small = { top: `${a.y - f.y - p}px`, left: `${a.x - f.x - p}px`, right: `${f.x + f.w - a.x - a.w - p}px`, bottom: `${f.y + f.h - a.y - a.h - p}px`, borderRadius: '10px' };
      const full = { top: '0px', left: '0px', right: '0px', bottom: '0px', borderRadius: '16px' };
      if (toMap) anim(bg, [{ ...small, opacity: 0 }, { ...small, opacity: 1, offset: 0.2 }, { ...full, opacity: 1 }], { d: 580, delay: 340 + i * 60 });
      else anim(bg, [{ ...full, opacity: 1 }, { ...small, opacity: 1, offset: 0.7 }, { ...small, opacity: 0 }], { d: 380 });
    });

    // 7. the map opens out of its slot (or closes back into it) and re-centres
    anim(MAPEL, toMap ? [{ clipPath: clipOf(slotR) }, { clipPath: FULL }] : [{ clipPath: FULL }, { clipPath: clipOf(slotTo) }], { d: MOVE + 80, delay: lead });

    await Promise.all(A.map((a) => a.finished)).catch(() => {});
    from.hidden = true;
    to.inert = false;
    MAPEL.style.clipPath = toMap ? 'none' : clipOf(slotTo);
    oldNumEl.style.visibility = newNumEl.style.visibility = '';
    FLY.hidden = true;
    A.forEach((a) => a.cancel());
    busy = false;
    $('[data-k="cta"]', to).focus({ preventScroll: true });
    const D = DATA[S.hz];
    LIVE.textContent = toMap ? `Map view. ${D.region}: ${D.prob} percent ${D.regionLabel}, ${RISK[D.risk]} risk.` : `Overview. ${D.items[S.sel].name}: ${D.items[S.sel].prob} percent.`;
  }

  // =====================================================================
  // TRAINING DATA — copied from skyalert/output.txt (notebooks/inspect_landsat.py).
  // Swap this object for a fetch of a JSON file once the training script writes one.
  // =====================================================================
  const STATS = {
    fire: {
      dataset: 'Landsat-8 Active Fire', source: 'skyalert/output.txt', script: 'notebooks/inspect_landsat.py',
      sampleSize: 100, imageShape: [256, 256, 10], imageDtype: 'uint16', maskShape: [256, 256], maskDtype: 'uint8',
      masks: [{ k: 'schroeder', name: 'Schroeder', s: 's1' }, { k: 'murphy', name: 'Murphy', s: 's2' }, { k: 'kumarRoy', name: 'Kumar-Roy', s: 's3' }],
      bands: [
        { ch: 0, band: 1, name: 'Coastal aerosol', min: 9045, max: 23070, mean: 10387.6 },
        { ch: 1, band: 2, name: 'Blue', min: 8192, max: 23316, mean: 9552.4 },
        { ch: 2, band: 3, name: 'Green', min: 7217, max: 23123, mean: 8647.9 },
        { ch: 3, band: 4, name: 'Red', min: 6259, max: 24575, mean: 8073.4 },
        { ch: 4, band: 5, name: 'Near-infrared', min: 5376, max: 28056, mean: 12272.1 },
        { ch: 5, band: 6, name: 'Shortwave infrared 1', min: 5114, max: 65535, mean: 10797.5 },
        { ch: 6, band: 7, name: 'Shortwave infrared 2', min: 5143, max: 65535, mean: 8397.9 },
        { ch: 7, band: 9, name: 'Cirrus', min: 4969, max: 6410, mean: 5054.5 },
        { ch: 8, band: 10, name: 'Thermal infrared 1', min: 18344, max: 61111, mean: 27938.6 },
        { ch: 9, band: 11, name: 'Thermal infrared 2', min: 16961, max: 45506, mean: 25430.7 },
      ],
      patches: [
        { id: 'LC08_L1TP_001067_20200812_20200812_01_RT_p00441', schroeder: 118, murphy: 142, kumarRoy: 137 },
        { id: 'LC08_L1TP_124017_20200826_20200826_01_RT_p00686', schroeder: 115, murphy: 157, kumarRoy: 156 },
        { id: 'LC08_L1TP_173068_20200817_20200817_01_RT_p00672', schroeder: 41, murphy: 52, kumarRoy: 53 },
        { id: 'LC08_L1TP_103068_20200823_20200823_01_RT_p00610', schroeder: 37, murphy: 52, kumarRoy: 55 },
        { id: 'LC08_L1TP_170069_20200812_20200812_01_RT_p00330', schroeder: 34, murphy: 44, kumarRoy: 47 },
      ],
    },
    flood: null,                                              // no flood dataset output yet
  };
  const UINT16 = 65535;
  const nf = (v) => v.toLocaleString('en-US');
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function scene(id) {                                        // LC08_L1TP_PPPRRR_YYYYMMDD_..._pNNNNN
    const p = id.split('_'), d = p[3];
    return { patch: p[p.length - 1], path: p[2].slice(0, 3), row: p[2].slice(3), date: `${MONTHS[+d.slice(4, 6) - 1]} ${+d.slice(6)}, ${d.slice(0, 4)}` };
  }
  const DS = $('#ds'), TIP = $('#tip');
  const tableView = { fire: false, bands: false };

  function trainingHTML() {
    const T = STATS[S.hz];
    const head = (eye, title, sub) => `<header class="ds-hd"><div><p class="ds-eye">${eye}</p><h2 id="ds-title">${title}</h2><p class="ds-sub">${sub}</p></div></header>`;
    if (!T) return `${head('Training data · Flood', 'No flood dataset loaded yet', 'Run the flood inspection script and its output will show here.')}
      <div class="ds-empty"><p>The fire dataset is available. Switch to Fire to see it.</p><button type="button" class="dsb" data-act="ds-fire">${ICON.fire()}<span>Show fire training data</span></button></div>`;

    const px = T.maskShape[0] * T.maskShape[1];
    const all = T.patches.flatMap((p) => T.masks.map((m) => p[m.k]));
    const peak = Math.max(...all), xmax = Math.ceil(peak / 40) * 40;
    const ratios = T.patches.flatMap((p) => [p.murphy / p.schroeder, p.kumarRoy / p.schroeder]);
    const lo = Math.round((Math.min(...ratios) - 1) * 100), hi = Math.round((Math.max(...ratios) - 1) * 100);
    const sat = T.bands.filter((b) => b.max >= UINT16);
    const pct = (v) => `${(v / px * 100).toFixed(2)}%`;

    const axis = (ticks, max, fmt) => `<div class="pl-axis" aria-hidden="true">${ticks.map((t) => `<span style="left:${t / max * 100}%">${fmt(t)}</span>`).join('')}</div>`;

    const fireChart = tableView.fire
      ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Patch</th><th class="tl">Scene date</th><th class="tl">Path / row</th>${T.masks.map((m) => `<th>${m.name}</th>`).join('')}<th>Fire share (max)</th></tr></thead><tbody>${T.patches.map((p) => { const s = scene(p.id); return `<tr><td>${s.patch}</td><td class="tl">${s.date}</td><td class="tl">${s.path} / ${s.row}</td>${T.masks.map((m) => `<td>${p[m.k]}</td>`).join('')}<td>${pct(Math.max(p.schroeder, p.murphy, p.kumarRoy))}</td></tr>`; }).join('')}</tbody></table></div>`
      : `<div class="key">${T.masks.map((m) => `<span><i style="background:var(--${m.s})"></i>${m.name}</span>`).join('')}</div>
        <div class="pl" role="img" aria-label="Fire pixels per patch for three mask algorithms. Table view available.">
          ${T.patches.map((p) => { const s = scene(p.id); return `<div class="pl-row hit" data-tip="${encodeURIComponent(JSON.stringify({ t: `${s.patch} · ${s.date}`, rows: T.masks.map((m) => [m.s, m.name, `${p[m.k]} px (${pct(p[m.k])})`]) }))}">
            <div class="pl-lab"><b>${s.patch}</b><small>${s.date} · ${s.path}/${s.row}</small></div>
            <div class="pl-plot"><div class="gb">${T.masks.map((m, i) => `<div class="gb-r ${m.s}"><span class="gb-b" style="width:${p[m.k] / xmax * 100}%"></span>${i === 0 || p[m.k] === Math.max(p.schroeder, p.murphy, p.kumarRoy) ? `<span class="gb-v">${p[m.k]}</span>` : ''}</div>`).join('')}</div></div>
          </div>`; }).join('')}
          ${axis([0, xmax / 4, xmax / 2, xmax * 3 / 4, xmax], xmax, (t) => t)}
        </div>`;

    const bandChart = tableView.bands
      ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Channel</th><th>Landsat band</th><th class="tl">Name</th><th>Min</th><th>Max</th><th>Mean</th></tr></thead><tbody>${T.bands.map((b) => `<tr><td>${b.ch}</td><td>${b.band}</td><td class="tl">${b.name}</td><td>${nf(b.min)}</td><td>${nf(b.max)}${b.max >= UINT16 ? ' (saturated)' : ''}</td><td>${nf(b.mean)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="key"><span><i class="k-span"></i>Min to max</span><span><i class="k-mean"></i>Mean</span><span><i style="background:var(--hz-deep);width:4px;height:12px;border-radius:2px"></i>Hits the 65,535 ceiling</span></div>
        <div class="pl" role="img" aria-label="Pixel value range per band on the 0 to 65,535 scale. Table view available.">
          ${T.bands.map((b) => `<div class="pl-row hit" data-tip="${encodeURIComponent(JSON.stringify({ t: `Band ${b.band} · ${b.name}`, rows: [[null, 'Min', nf(b.min)], [null, 'Mean', nf(b.mean)], [null, 'Max', nf(b.max) + (b.max >= UINT16 ? ', saturated' : '')]] }))}">
            <div class="pl-lab">B${b.band} · ${b.name}</div>
            <div class="pl-plot"><div class="rg"><span class="rg-span" style="left:${b.min / UINT16 * 100}%;width:${(b.max - b.min) / UINT16 * 100}%"></span>${b.max >= UINT16 ? '<span class="rg-sat" style="left:100%"></span>' : ''}<span class="rg-mean" style="left:${b.mean / UINT16 * 100}%"></span></div></div>
          </div>`).join('')}
          ${axis([0, 16384, 32768, 49152, UINT16], UINT16, (t) => (t === UINT16 ? '65,535' : t ? `${t / 1024}k` : '0'))}
        </div>`;

  // =====================================================================
  // LIVE FIRE DATA — from the SkyAlert backend (backend/dashboard.py):
  //   /api/fires         today's detections, NASA FIRMS

  // Flood stays on sample data: there is no live flood source yet.
  // =====================================================================
  const CA = [[32.5, -124.5], [42.0, -114.1]];                // first view: California
  const LEVEL = { low: 1, moderate: 2, high: 3, critical: 4 };
  const CLUSTER_KM = 15, CANDIDATES = 8;                      // detections this close count as one fire; strongest 8 get weather
  const BANNER = $('#banner'), LOADER = $('#loader'), BUSY = $('#busyDot');
  let FIRES = [], pick = null, liveSeq = 0, MODEL_STATUS = { ready: false };
  const ctxCache = new Map(), fcCache = new Map();
  const kmBetween = (a, b) => Math.hypot((a[0] - b[0]) * 111.32, (a[1] - b[1]) * 111.32 * Math.cos(a[0] * Math.PI / 180));
  const compass = (deg) => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round((((deg % 360) + 360) % 360) / 45) % 8];

  async function getJSON(url, ms) {
    const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
    try {
      const r = await fetch(url, { signal: c.signal });
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return await r.json();
    } finally { clearTimeout(t); }
  }
  function getCtx(lat, lon) {                                 // one request per ~1 km spot, shared by everything that asks
    const k = `${lat.toFixed(2)},${lon.toFixed(2)}`;
    if (!ctxCache.has(k)) ctxCache.set(k, getJSON(`/api/fire-context?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`, 30000)
      .catch((err) => { ctxCache.delete(k); return { location: null, weather: null, reasons: [], errors: [String(err)] }; }));
    return ctxCache.get(k);
  }
  function getForecast(lat, lon) {                            // the spread model's 64 x 64 km forecast around a spot
    const k = `${lat.toFixed(2)},${lon.toFixed(2)}`;
    if (!fcCache.has(k)) fcCache.set(k, getJSON(`/api/spread-forecast?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`, 90000)
      .catch((err) => { fcCache.delete(k); return { status: 'inputs_unavailable', note: String(err) }; }));
    return fcCache.get(k);
  }
  // Model chance -> risk level. 62% is the model's own cutoff for "this square burns tomorrow".
  const chanceLevel = (p) => (p >= 62 ? 4 : p >= 40 ? 3 : p >= 20 ? 2 : 1);
  async function applyForecast(it) {
    it.fc = await getForecast(...it.latlng);
    if (it.fc.status !== 'ok') return;
    it.prob = Math.round(it.fc.chance_near * 100);
    it.risk = chanceLevel(it.prob);
  }
  const heatCache = new WeakMap();
  function heatURL(fc) {                                      // forecast grid -> see-through PNG, brighter = more likely
    if (heatCache.has(fc)) return heatCache.get(fc);
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), img = g.createImageData(64, 64);
    const stops = [[0, [247, 223, 166]], [0.35, [242, 193, 78]], [0.62, [245, 130, 58]], [1, [217, 87, 87]]];
    fc.probability.forEach((row, y) => row.forEach((p, x) => {

      model: m ? "SkyAlert spread model, on today's FIRMS fires and GRIDMET weather" : 'Fosberg fire-weather index, from Open-Meteo weather',
      headline: !anyFire ? 'No fires detected in CA in the last 2 days'

  async function buildLive(withModel = true) {

    drawData();
    fitView(true);
    LIVE.textContent = m === 'model' ? 'Showing the fire detector on a past fire, Sequoia National Forest, August 2020.' : "Showing today's live fires.";
  }
  function selectTile(i) {
    if (busy) return;
    S.mSel = i;
    render();
    drawData();
    const r = MODEL.detector.rows[i];
    LIVE.textContent = `Tile ${i + 1}: caught ${r.found} of ${r.label} fire pixels.`;
  }
  function select(i) {
    if (busy) return;
    const fly = S.view === 'mv' && !(S.hz === 'fire' && S.mode === 'model');   // in the map view, picking a fire flies to it
    if (i === S.sel) { if (fly) { S.focus = !S.focus; drawMarkers(); fitView(true); } return; }   // same fire again: toggle between it and the top 5
    const prev = DATA[S.hz].items[S.sel].prob, prevId = DATA[S.hz].items[S.sel].id, prevFwi = DATA[S.hz].items[S.sel].fwi;
    S.sel = i;
    render();
    drawMarkers();
    if (fly) { S.focus = true; fitView(true); }
    const it = DATA[S.hz].items[i];
    if (S.view === 'ov' && !REDUCE.matches) countUp($('.ov-num .fn', OV), prev, it.prob, 420, 0);
    if (S.view === 'mv') rollCoords($('.selp-id', MV), prevId, it.id, 600);
    const fwiEl = $('.fwi-n', MV);                             // fire-weather index counts from the last fire's score
    if (S.view === 'mv' && fwiEl && Number.isFinite(prevFwi) && !REDUCE.matches) countUp(fwiEl, prevFwi, it.fwi, 600, 0);
    LIVE.textContent = `${it.name} selected: ${it.prob} percent, ${RISK[it.risk]} risk.`;
  }
  function setHz(hz) {
    if (busy || hz === S.hz) return;
    const prev = S.hz;
    S.hz = hz; S.sel = 0; S.mode = 'live'; S.focus = false;
    APP.dataset.hz = hz;
    render(prev);                                             // toggles start on the old side…
    requestAnimationFrame(() => requestAnimationFrame(() => {  // …then flip, so the indicator slides
      $$('.hzt').forEach((t) => { t.dataset.hz = hz; $$('button', t).forEach((b) => { const on = b.dataset.setHz === hz; b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; }); });
    }));
    const lay = active();
    lay.classList.remove('is-swapping'); void lay.offsetWidth; lay.classList.add('is-swapping');
    setTimeout(() => lay.classList.remove('is-swapping'), 500);
    drawData();
    fitView(true);
    LIVE.textContent = `${hz === 'fire' ? 'Fire' : 'Flood'} mode.`;
  }
  function setTheme(t) {
    S.theme = t;
    document.documentElement.dataset.theme = t;
    store.set('theme', t);
    setTiles();
    render();
  }

  APP.addEventListener('click', (e) => {
    const b = e.target.closest?.('button');
    if (!b || busy) return;
    if (b.dataset.setHz) setHz(b.dataset.setHz);
    else if (b.dataset.act === 'theme') setTheme(S.theme === 'dark' ? 'light' : 'dark');
    else if (b.dataset.act === 'data') openDS();
    else if (b.dataset.act === 'focus') go('mv');
    else if (b.dataset.act === 'model') { S.mode = 'model'; render(); drawData(); go('mv'); }
    else if (b.dataset.mode) setMode(b.dataset.mode);
    else if (b.dataset.msel != null) selectTile(+b.dataset.msel);
    else if (b.dataset.act === 'back') go('ov');
    else if (b.dataset.act === 'zin') MAP?.zoomIn();
    else if (b.dataset.act === 'zout') MAP?.zoomOut();
    else if (b.dataset.sel != null) select(+b.dataset.sel);
  });
  APP.addEventListener('change', (e) => {
    const mk = e.target.dataset?.mlayer;
    if (mk) { S.mLayers[mk] = e.target.checked; drawData(); return; }
    const k = e.target.dataset?.layer;
    if (!k) return;
    S.layers[k] = e.target.checked;
    render();
    drawData();
  });
  document.addEventListener('keydown', (e) => {
    if (DS.open) return;                                      // the dialog handles its own keys (Escape closes it)
    if (e.key === 'Escape' && S.view === 'mv') { go('ov'); return; }
    const b = e.target.closest?.('.hzt button');
    if (b && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
      e.preventDefault();
      const hz = S.hz === 'fire' ? 'flood' : 'fire';
      setHz(hz);
      $(`[data-set-hz="${hz}"]`, active())?.focus();
    }
  });

  // =====================================================================
  // START
  // =====================================================================
  document.documentElement.dataset.theme = S.theme;
  startLive().then(() => {
    LOADER.hidden = true;
    render();
    MV.inert = true;
    initMap();
    layoutMap();
    document.fonts?.ready.then(() => { if (!busy) layoutMap(); });
    let raf = 0;
    new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { if (!busy) { layoutMap(); fitCells(); } }); }).observe(APP);
    window.skyalertFlow = { go, state: S, setHz, select, refreshLive };
    if (MODEL_STATUS.ready && DATA.fire.live) { BUSY.textContent = 'Running the spread model on today\'s data…'; refreshLive(S.sel); }
  });
})();
</script>
</body>
</html>
