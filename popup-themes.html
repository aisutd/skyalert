<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyAlert popup themes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Same orange and neutrals as the dashboard (frontend/src/index.css) */
  :root {
    --accent: #f26b1d;
    --accent-soft: rgba(242, 107, 29, 0.12);
    --page-bg: #f6f7f9;
    --map-bg: #e8e6e1;
    --surface: #ffffff;
    --text: #1b1d22;
    --muted: #6b7080;
    --border: rgba(20, 22, 28, 0.10);
    --hover: #f4f5f7;
    --shadow: 0 4px 16px rgba(20, 22, 28, 0.12);
    --tint: #fff4ec;
    --track: #eceef2;
    --ok: #2f9e6b; --warn: #d99a00; --hot: #e5483a;
  }
  html[data-theme="dark"] {
    --page-bg: #101217;
    --map-bg: #1b1e26;
    --surface: #1b1e26;
    --text: #eef0f3;
    --muted: #9aa0ad;
    --border: rgba(255, 255, 255, 0.10);
    --hover: #262a34;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    --tint: #2a2118;
    --track: #2d313c;
    --ok: #3ecf8e; --warn: #f5c542; --hot: #ff6a5a;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  header.top h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header.top p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  .switch { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .switch button { font: inherit; font-size: 13px; padding: 7px 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding: 24px; }
  .stage { background: var(--map-bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 22px; }
  .stage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .num { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
  .name { font-size: 13px; font-weight: 600; margin-left: 10px; flex: 1; }
  .desc { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .marker { width: 10px; height: 10px; border-radius: 50%; background: var(--hot); border: 2px solid #fff; margin: 0 0 10px 6px; box-shadow: 0 1px 4px rgba(0,0,0,.35); }

  /* ---------- the popup (shared structure; each .vN restyles it) ---------- */
  .pop {
    --r: 10px; --pad: 14px;
    --p-bg: var(--surface); --p-text: var(--text); --p-muted: var(--muted); --p-border: var(--border);
    --p-shadow: var(--shadow); --p-chip: var(--accent-soft); --p-chip-text: var(--accent);
    --p-title: var(--text); --p-eyebrow: var(--accent); --p-bar: var(--accent);
    background: var(--p-bg); color: var(--p-text); border: 1px solid var(--p-border);
    border-radius: var(--r); box-shadow: var(--p-shadow); overflow: hidden; font-size: 13px; line-height: 1.4;
  }
  .pop .head { padding: var(--pad); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .pop .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--p-eyebrow); }
  .pop h3 { margin: 3px 0 0; font-size: 16px; font-weight: 600; color: var(--p-title); }
  .pop .coords { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--p-muted); margin-top: 2px; }
  .pop .close { color: var(--p-muted); font-size: 18px; line-height: 1; }
  .pop .body { padding: 0 var(--pad) var(--pad); }
  .pop .risk { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: calc(var(--r) - 3px);
    background: var(--p-chip); color: var(--p-chip-text); }
  .pop .risk b { font-size: 15px; font-weight: 600; }
  .pop .risk span { font-size: 11px; opacity: .85; display: block; }
  .pop .risk .idx { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500; text-align: right; }
  .pop .meter { height: 5px; background: var(--track); border-radius: 99px; margin: 10px 0 12px; overflow: hidden; }
  .pop .meter i { display: block; height: 100%; width: 62%; background: var(--p-bar); border-radius: 99px; }
  .pop .label { font-size: 11px; color: var(--p-muted); }
  .pop .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .pop .stat { padding: 8px 10px; border: 1px solid var(--p-border); border-radius: calc(var(--r) - 4px); }
  .pop .stat strong { display: block; margin-top: 2px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }
  .pop .conf { color: var(--p-eyebrow); }
  .pop .btn { display: block; width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: calc(var(--r) - 3px);
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: default; }
  .pop .credits { margin-top: 10px; font-size: 10.5px; color: var(--p-muted); }

  /* 1 Classic card: matches the zoom + layer controls exactly */
  .v1 { --r: 10px; }

  /* 2 Orange header: solid orange band, white text */
  .v2 { --r: 12px; }
  .v2 .head { background: var(--accent); --p-title: #fff; --p-eyebrow: rgba(255,255,255,.85); --p-muted: rgba(255,255,255,.85); padding-bottom: 12px; }
  .v2 .head .coords, .v2 .head .close { color: rgba(255,255,255,.85); }
  .v2 .body { padding-top: 12px; }

  /* 3 Left accent bar: square-ish with a thick orange edge */
  .v3 { --r: 6px; border-left: 4px solid var(--accent); }

  /* 4 Warm tint: orange-tinted surface and border */
  .v4 { --r: 14px; --p-bg: var(--tint); --p-border: rgba(242,107,29,.35); --p-chip: var(--surface); }
  .v4 .stat { background: var(--surface); }

  /* 5 Flat technical: sharp corners, orange outline, mono labels */
  .v5 { --r: 3px; --p-border: var(--accent); --p-shadow: none; border-width: 2px; }
  .v5 .eyebrow, .v5 .label { font-family: 'JetBrains Mono', monospace; letter-spacing: .04em; }
  .v5 .risk { background: transparent; border: 1px solid var(--accent); }

  /* 6 Always dark: charcoal panel with orange highlights, in light and dark mode */
  .v6 { --r: 12px; --p-bg: #14161c; --p-text: #eef0f3; --p-muted: #9aa0ad; --p-border: rgba(255,255,255,.10); --p-title: #fff;
    --p-chip: rgba(242,107,29,.16); --p-chip-text: #ff9a55; --p-eyebrow: #ff9a55; --track: #2d313c; }

  /* 7 Pill chips: very round, small orange chips */
  .v7 { --r: 18px; }
  .v7 .risk { border-radius: 99px; padding: 8px 16px; }
  .v7 .stat { border: 0; background: var(--accent-soft); border-radius: 99px; text-align: center; padding: 8px 6px; }
  .v7 .btn { border-radius: 99px; }

  /* 8 Quiet outline: no fill on the risk row, orange only on the numbers */
  .v8 { --r: 8px; --p-shadow: none; --p-chip: transparent; --p-chip-text: var(--text); }
  .v8 .risk { border: 1px solid var(--p-border); }
  .v8 .risk .idx, .v8 .conf { color: var(--accent); }
  .v8 .btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  /* 9 Blend A: 1's card (shadow, header) with 8's outlined risk row, orange numbers, outlined button */
  .v9 { --r: 10px; --p-chip: transparent; --p-chip-text: var(--text); }
  .v9 .risk { border: 1px solid var(--p-border); }
  .v9 .risk .idx, .v9 .conf { color: var(--accent); }
  .v9 .btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  /* 10 Blend B: 1 as is (tinted risk chip), with only 8's orange confidence value and outlined button */
  .v10 { --r: 10px; }
  .v10 .btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>SkyAlert popup themes</h1>
    <p>Tell me the number you want. Every option is flat, with no gradients and no line from the dot.</p>
  </div>
  <div class="switch" role="group" aria-label="Map theme">
    <button type="button" data-set="light" aria-pressed="true">Light</button>
    <button type="button" data-set="dark" aria-pressed="false">Dark</button>
  </div>
</header>
<main class="grid" id="grid"></main>

<script>
  var THEMES = [
    ['1', 'Classic card', 'Same card look as the zoom and layer controls. 10px corners, hairline border, orange only for labels and the risk chip.'],
    ['2', 'Orange header', 'Solid orange title band with white text. Most team-colored option.'],
    ['3', 'Left accent bar', 'Square-ish 6px corners with a thick orange edge on the left.'],
    ['4', 'Warm tint', 'Soft orange-tinted surface and border, 14px corners.'],
    ['5', 'Flat technical', 'Sharp 3px corners, orange outline, mono labels, no shadow.'],
    ['6', 'Always dark', 'Charcoal panel with orange highlights, even when the map is in light mode.'],
    ['7', 'Pill chips', 'Very round 18px corners, pill-shaped risk and stat chips.'],
    ['8', 'Quiet outline', 'Neutral and minimal. Orange appears only on the numbers and the button outline.'],
    ['9', 'Blend A (1 + 8)', '1\'s card and shadow, with 8\'s outlined risk row, orange numbers and outlined button.'],
    ['10', 'Blend B (1 + 8)', '1 exactly, with the tinted risk chip kept, and only 8\'s outlined button.']
  ];

  function popup(cls) {
    return '<div class="pop ' + cls + '">' +
      '<div class="head"><div><div class="eyebrow">Fire details</div><h3>Gunnison County, Colorado</h3>' +
      '<div class="coords">38.5421°N, 106.9253°W</div></div><span class="close">×</span></div>' +
      '<div class="body">' +
        '<div class="risk"><div><b>High</b><span>Fire-weather risk</span></div><div class="idx">62<span>Fosberg index</span></div></div>' +
        '<div class="meter"><i></i></div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="label">Confidence</div><strong class="conf">High</strong></div>' +
          '<div class="stat"><div class="label">Brightness</div><strong>341.2 K</strong></div>' +
          '<div class="stat"><div class="label">FRP</div><strong>8.4 MW</strong></div>' +
        '</div>' +
        '<button class="btn" type="button">View analysis</button>' +
        '<div class="credits">Weather: Open-Meteo · Place: © OpenStreetMap · Fire: NASA FIRMS</div>' +
      '</div></div>';
  }

  document.getElementById('grid').innerHTML = THEMES.map(function (t) {
    return '<section class="stage"><div class="stage-head"><div class="num">' + t[0] + '</div><div class="name">' + t[1] + '</div></div>' +
      '<p class="desc">' + t[2] + '</p><div class="marker"></div>' + popup('v' + t[0]) + '</section>';
  }).join('');

  document.querySelectorAll('.switch button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.documentElement.dataset.theme = b.dataset.set;
      document.querySelectorAll('.switch button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
    });
  });
</script>
</body>
</html>
